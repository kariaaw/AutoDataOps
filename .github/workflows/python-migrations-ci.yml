name: Python Migration CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-tests:
    name: Python Migration Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m compileall -q scripts tests/unit

      - name: Check provisioning Bash syntax
        run: bash -n scripts/provision_postgres_roles.sh

      - name: Run migration unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
