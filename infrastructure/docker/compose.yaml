name: autodataops-dev

services:

  postgres:
    image: postgres:18.6

    restart: unless-stopped

    environment:
      POSTGRES_DB: autodataops
      POSTGRES_USER: autodataops_bootstrap
      POSTGRES_PASSWORD: ${AUTODATAOPS_POSTGRES_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

    stop_grace_period: 30s

volumes:
  pgdata:
